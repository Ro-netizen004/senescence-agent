name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: pure-Python routing / workflow logic. No scientific deps, runs in
  # seconds, so a broken router or governance route fails the PR immediately.
  unit-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run pure-Python unit tests
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest \
            tests.test_intent_router \
            tests.test_deterministic_routing \
            tests.test_workflows

  # Full gate: exercises the scanpy pipeline + the marker-based cluster
  # annotator on synthetic data (no external datasets required).
  unit-scanpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scanpy-backed tests
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: |
          python -m tests.test_cell_type_annotation
          python -m unittest tests.test_plausibility
